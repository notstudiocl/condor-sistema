# Admin panel (admin/) — se sirve bajo /condor-sistema/admin/ (mismo base path que vite.config.js).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = / { return 302 /condor-sistema/admin/; }

  location = /condor-sistema/admin/index.html { add_header Cache-Control "no-cache"; }
  location = /condor-sistema/admin/ {
    add_header Cache-Control "no-cache";
    try_files /condor-sistema/admin/index.html =404;
  }

  location /condor-sistema/admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /condor-sistema/admin/ {
    try_files $uri $uri/ /condor-sistema/admin/index.html;
  }
}
