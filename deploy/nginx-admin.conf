# Admin panel (admin/) — se sirve bajo /admin/ de condor.notstudio.cl (EasyPanel enruta el
# prefijo /admin a este servicio SIN quitarlo, por eso los archivos viven en html/admin/).
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = / { return 302 /admin/; }
  location = /admin { return 302 /admin/; }

  location = /admin/ {
    add_header Cache-Control "no-cache";
    try_files /admin/index.html =404;
  }
  location = /admin/index.html { add_header Cache-Control "no-cache"; }

  location /admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }
}
