# App de terreno (client/) — raíz de condor.notstudio.cl. El admin vive en /admin/ del mismo
# dominio pero en otro servicio: EasyPanel enruta ese prefijo antes de llegar aquí.
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # index.html, sw.js y manifest nunca cacheados: si no, una PWA instalada no ve deploys nuevos
  location ~* ^/(index\.html|sw\.js|manifest\.json)?$ {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
