# App de terreno (client/) — se sirve bajo /condor-sistema/ para conservar el mismo
# base path que GitHub Pages (vite.config.js, manifest.json y sw.js lo asumen).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = / { return 302 /condor-sistema/; }

  # index.html, sw.js y manifest nunca cacheados: si no, una PWA instalada no ve deploys nuevos
  location ~* ^/condor-sistema/(index\.html|sw\.js|manifest\.json)?$ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }

  location /condor-sistema/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /condor-sistema/ {
    try_files $uri $uri/ /condor-sistema/index.html;
  }
}
